[package]
name = "liv"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
dirs = "6.0.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tar = "0.4"
walkdir = "2"
toml = "0.9.8"
octocrab = { version = "0.49.5", features = ["stream"] }
futures-util = "0.3.31"
prodash = { version = "30.0.1", features = ["log", "progress-log"] }

[dependencies.gix]
version = "0.77.0"
default-features = false
features = ["blocking-http-transport-reqwest-native-tls", "basic", "parallel"]
